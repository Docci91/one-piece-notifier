# Fichier à placer dans ton repo à : .github/workflows/monitor.yml
#
# Ce workflow relance monitor.py --once toutes les 5 minutes sur les serveurs
# de GitHub. state.json (la mémoire des pages déjà vues) est réenregistré dans
# le repo après chaque passage pour que la prochaine exécution s'en souvienne.

name: DO Display Notifier

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:   # permet de lancer une vérification manuelle depuis l'onglet Actions
    inputs:
      test:
        description: "Envoyer une notification de test (sans vérifier les vrais sites)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # nécessaire pour que le workflow puisse commiter state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Vérifier les sites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py --once
          fi

      - name: Sauvegarder l'état pour la prochaine vérification
        run: |
          git config user.name "do-display-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Rien à sauvegarder."
            exit 0
          fi
          git commit -m "update state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push réussi."
              exit 0
            fi
            echo "Push rejeté (le dépôt a bougé entre-temps), on se resynchronise et on réessaie..."
            git fetch origin main
            git rebase origin/main -X ours
            sleep 3
          done
          echo "Echec du push après plusieurs tentatives."
          exit 1
